name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The app runs on Node 20.10+, but `node --test "<glob>"` needs 21+.
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The platform runs on Node built-ins only, so there is nothing to install.
      - name: Syntax check
        run: |
          find server web electron tests \( -name '*.js' -o -name '*.cjs' \) \
            -not -path 'server/templates/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Tests
        run: npm test

      - name: Version and changelog agree
        run: npm run version:check
